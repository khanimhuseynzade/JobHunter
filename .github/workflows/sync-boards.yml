name: Sync job boards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync boards
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run sync:boards
